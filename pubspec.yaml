name: campus_hub
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.2.1
  iconsax: ^0.0.8

  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  firebase_database: ^11.3.2
  firebase_storage: ^12.4.10


  google_sign_in: ^6.2.2
  url_launcher: ^6.3.0
  intl: ^0.19.0
  image_picker: ^1.1.2
  uuid: ^4.5.1
  http: ^1.2.2
  crypto: ^3.0.3
  flutter_image_compress: ^2.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/campus_hub_logo.png
  min_sdk_android: 21
  remove_alpha_ios: true


flutter:
  uses-material-design: true
